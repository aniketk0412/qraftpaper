name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same branch so a fast follow-up commit
# doesn't sit behind a stale CI run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mirror what a contributor runs locally before pushing — same script,
      # same exit codes. The composite `check` script chains
      # typecheck → lint → test so the first failure short-circuits the
      # rest. Individual steps are still listed below for cleaner CI logs.

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test

      # Dependency vulnerability gate. Fails the build on HIGH/critical
      # advisories only — moderate/low are reported by `npm audit` locally but
      # don't block CI (today's tree has only moderate postcss issues bundled
      # inside Next itself, which aren't separately fixable). Raise the bar to
      # `moderate` once the dependency tree is clean at that level.
      - name: Audit dependencies
        run: npm audit --audit-level=high
